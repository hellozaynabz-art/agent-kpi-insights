[project]
name = "agent-kpi-insights"
version = "0.1.0"
description = "Agent that detects KPI anomalies, investigates root causes and writes an executive summary"
readme = "README.md"
authors = [{ name = "Zaynab Zennour" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["anthropic", "pandas", "numpy", "python-dotenv", "rich", "pyarrow", "tabulate"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpi_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines are left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
kpi-agent = "kpi_agent.cli:main"
